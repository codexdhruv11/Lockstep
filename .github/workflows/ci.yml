name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The fast set only. Tests tagged "container" need Docker and take about twenty minutes;
      # they run in integration.yml. A long job that goes red on a busy runner is a job people
      # learn to ignore, which costs more than the coverage it buys on every push.
      - name: build and run the fast tests
        run: mvn -B --no-transfer-progress verify -DexcludedGroups=container

      - name: check the jar runs
        run: java -jar target/lockstep.jar version

      - uses: actions/upload-artifact@v4
        with:
          name: lockstep-jar
          path: target/lockstep.jar
          retention-days: 14
