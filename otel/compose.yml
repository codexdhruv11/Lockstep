# A trace backend in one command, so `--trace` has somewhere to land:
#
#   docker compose -f otel/compose.yml up -d
#   open http://localhost:16686
#
# No account, no vendor, no cost. Point the target's OpenTelemetry exporter at
# http://localhost:4317 (gRPC) or http://localhost:4318 (HTTP) and its spans will appear in
# Jaeger, parented to the requests Lockstep sent.
services:
  jaeger:
    # all-in-one carries the collector, storage and UI in one process. In-memory storage: this
    # exists to read a load test's traces, not to keep them.
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # the UI
      - "4317:4317"     # OTLP gRPC — what most exporters default to
      - "4318:4318"     # OTLP HTTP
